[project]
name = "perception"
version = "1.1.0"
description = "Pipeline percepcji z dashcama: DETR, śledzenie, głębia"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10",
]

[project.scripts]
perception = "perception.cli:main"
perception-ui = "perception.app:main"

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "pillow>=10",
    "timm>=1.0",
]
ui = ["gradio>=5", "imageio-ffmpeg>=0.6"]
label = ["streamlit>=1.40", "streamlit-image-coordinates>=0.2"]
train = [
    "torchmetrics>=1.4",
    "pycocotools>=2.0",
    "pyyaml>=6",
    "wandb>=0.17",
]
export = [
    "onnx>=1.17",
    "onnxscript>=0.1",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=26.10.1",
    "mutmut>=3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perception"]

# Na Linuksie (CI) bierzemy torcha CPU-only, bez wielogigabajtowych zależności CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb", "build_notebook.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: wymaga pobranych wag z Hugging Face (wolny, tylko job 'model' w CI)"]

[tool.coverage.run]
source = ["perception"]
branch = true
omit = ["perception/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
fail_under = 60

[tool.mutmut]
source_paths = ["perception"]
only_mutate = ["perception/cli.py"]
pytest_add_cli_args = ["-m", "not model", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = ["tests/test_cli.py"]
