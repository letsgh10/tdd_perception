name: CI

on:
  push:
    branches: [main, ci-tests]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run ruff check perception scripts
      - run: uv run black --check perception scripts
      - run: uv run mypy perception scripts
      - run: uv run pytest -m "not model" --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  model:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('perception/detect.py', 'perception/depth.py') }}
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run pytest
      - name: Bramka jakości (metryki vs thresholds.json)
        run: uv run python scripts/evaluate.py --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: metrics.json
          if-no-files-found: ignore

  mutation-job:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      - name: Testy mutacyjne (perception/cli.py)
        run: uv run mutmut run
      - name: Raport (Job Summary)
        if: always()
        run: |
          set +e
          uv run python scripts/mutation_report.py --min-score 90 > mutation-report.md
          status=$?
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-report.md
          if-no-files-found: ignore
